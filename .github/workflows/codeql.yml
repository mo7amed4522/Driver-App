name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch outdated plugins
        run: bash scripts/patch_v1_embedding.sh

      - name: Initialize CodeQL (Java/Kotlin)
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Compile Java/Kotlin (skip native builds)
        run: |
          cd android
          ./gradlew compileDebugSources compileReleaseSources \
            --no-daemon \
            --no-configuration-cache \
            2>&1 || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
