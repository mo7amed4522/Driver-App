name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.3.2)'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Validate version format
        id: validate
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version '$VERSION' does not match v*.*.* pattern"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING_KEY != '' && 'signed' || 'debug' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode signing key
        if: env.ANDROID_SIGNING == 'signed'
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=android/app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Cleanup signing material
        if: always()
        run: rm -f android/app/release.keystore android/key.properties

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload App Bundle artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

  build-ios:
    name: Build iOS Release
    needs: validate
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Install CocoaPods
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          cd ios && pod install --repo-update

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ios-ipa
          path: build/ios/Release-iphoneos/Runner.app
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download Android APK artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          name: android-apk
          path: ./artifacts/apk

      - name: Download Android AAB artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          name: android-aab
          path: ./artifacts/aab

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          name: ios-ipa
          path: ./artifacts/ios

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG="Initial release of Ridy Driver App"
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "$CHANGELOG" > CHANGELOG.txt

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@c062e08bd532815e1b14b3623c2f40f418fe5d1f
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body: |
            ## 🚀 Release ${{ needs.validate.outputs.version }}

            ### 📱 Installation

            **Android:**
            - Download the appropriate APK for your device architecture
            - Enable "Install from Unknown Sources" in your device settings
            - Install the APK

            **iOS:**
            - Build and distribute through TestFlight or App Store Connect
            - Requires an Apple Developer account and valid provisioning profiles

            ### 📝 Changes

            ${{ steps.changelog.outputs.changelog }}

            ### 🔧 Requirements

            - **Android**: 5.0 (API 21) or higher
            - **iOS**: 13.0 or higher

            ### ⚠️ Important

            This release is built from the tag. Store distribution (Google Play / App Store) is a separate gated process that requires protected credentials and manual approval.

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ needs.validate.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/apk/*.apk
            ./artifacts/aab/*.aab
            CHANGELOG.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}